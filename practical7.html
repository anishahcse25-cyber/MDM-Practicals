<!DOCTYPE html>
<html>
<head>
    <title>Interactive FAQ</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-r from-yellow-500 to-pink-600">

    

<!-- Name and USN in Top-Right Corner -->
<div class="absolute top-4 right-5
            bg-white border-2 border-black-400
            px-5 py-3 rounded-xl shadow-md
            text-red-700 text-right">

    <p class="text-xl font-extrabold">
        Anisha Haldar
    </p>

    <p class="text-lg font-extrabold">
        USN: CS25069
    </p>

</div>



    <div class="min-h-screen flex items-center justify-center p-5">

        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">

            <!-- College Name -->
            <h1 class="text-center text-lg font-semibold text-gray-700 mb-2">
                S. B. Jain Institute
            </h1>

            <!-- Highlighted Heading -->
            <h2 class="text-3xl font-bold text-center text-white
                       bg-gradient-to-r from-red-600 to-yellow-600
                       p-3 rounded-xl shadow-md mb-3">
                Student Help Portal
            </h2>

            <p class="text-center mb-5 text-gray-600">
                Frequently Asked Questions
            </p>

            <!-- Search Bar -->
            <input
                type="text"
                id="search"
                placeholder="🔍 Search your question..."
                class="w-full p-3 mb-5 border-2 border-red-300 rounded-lg
                       focus:outline-none focus:border-purple-600"
            >

            <!-- FAQ 1 -->
            <div class="faq mb-3">
                <button class="question w-full text-left p-3
                    bg-gradient-to-r from-red-500 to-pink-500
                    text-white rounded-lg font-semibold">
                    What are the college timings?
                </button>

                <p class="answer hidden p-3 bg-red-50 rounded-b-lg">
                    College timings are from 9:00 AM to 5:00 PM.
                </p>
            </div>

            <!-- FAQ 2 -->
            <div class="faq mb-3">
                <button class="question w-full text-left p-3
                    bg-gradient-to-r from-red-500 to-pink-500
                    text-white rounded-lg font-semibold">
                    How can I apply for leave?
                </button>

                <p class="answer hidden p-3 bg-purple-50 rounded-b-lg">
                    You can apply for leave through the college portal.
                </p>
            </div>

            <!-- FAQ 3 -->
            <div class="faq mb-3">
                <button class="question w-full text-left p-3
                    bg-gradient-to-r from-red-500 to-pink-500
                    text-white rounded-lg font-semibold">
                    Where can I check my timetable?
                </button>

                <p class="answer hidden p-3 bg-purple-50 rounded-b-lg">
                    You can check your timetable on the student portal.
                </p>
            </div>

        </div>
    </div>

    <script>

        // Get all questions
        let questions = document.querySelectorAll(".question");

        // Add click event to each question
        questions.forEach(function(question) {

            question.addEventListener("click", function() {

                // Get the answer
                let answer = question.nextElementSibling;

                // Show / Hide answer
                answer.classList.toggle("hidden");

            });

        });

        // Search functionality
        let search = document.getElementById("search");
        let faqs = document.querySelectorAll(".faq");

        search.addEventListener("input", function() {

            let text = search.value.toLowerCase();

            faqs.forEach(function(faq) {

                let question = faq.querySelector(".question").textContent.toLowerCase();

                if (question.includes(text)) {
                    faq.style.display = "block";
                } else {
                    faq.style.display = "none";
                }

            });

        });

    </script>

</body>
</html>
