<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-2xl mx-auto py-10 px-4">

        <!-- Header -->
        <div class="bg-blue-600 text-white text-center p-6 rounded-t-xl">
            <h1 class="text-3xl font-bold"> Anisha Haldar <br></h1>
            <h1 class="text-3xl font-bold"> CS25069</h1>
            <h1 class="text-3xl font-bold">Personal To-Do List</h1>
            <p class="mt-2">Organize our academic and personal tasks</p>
        </div>

        <!-- Main Container -->
        <div class="bg-white p-6 rounded-b-xl shadow-lg">

            <!-- Add Task -->
            <div class="flex gap-2 mb-6">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

                <button
                    onclick="addTask()"
                    class="bg-blue-600 text-white px-5 py-3 rounded-lg hover:bg-blue-700"
                >
                    Add
                </button>
            </div>

            <!-- Task List -->
            <ul id="taskList" class="space-y-3"></ul>

            <!-- Empty Message -->
            <p id="emptyMessage" class="text-center text-gray-500 py-5">
                No tasks added yet.
            </p>

            <!-- Task Counter -->
            <div class="mt-6 pt-4 border-t text-center text-gray-600">
                <span id="taskCounter">0 tasks</span>
            </div>

        </div>
    </div>

    <script>
        let tasks = [];

        function addTask() {
            const input = document.getElementById("taskInput");
            const taskText = input.value.trim();

            if (taskText === "") {
                alert("Please enter a task.");
                return;
            }

            const task = {
                id: Date.now(),
                text: taskText,
                completed: false
            };

            tasks.push(task);
            input.value = "";

            displayTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return {
                        ...task,
                        completed: !task.completed
                    };
                }
                return task;
            });

            displayTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            displayTasks();
        }

        function displayTasks() {
            const taskList = document.getElementById("taskList");
            const emptyMessage = document.getElementById("emptyMessage");
            const taskCounter = document.getElementById("taskCounter");

            taskList.innerHTML = "";

            if (tasks.length === 0) {
                emptyMessage.style.display = "block";
            } else {
                emptyMessage.style.display = "none";
            }

            tasks.forEach(task => {

                const li = document.createElement("li");

                li.className =
                    "flex items-center justify-between bg-gray-50 border border-gray-200 p-4 rounded-lg";

                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input
                            type="checkbox"
                            ${task.completed ? "checked" : ""}
                            onchange="toggleTask(${task.id})"
                            class="w-5 h-5 accent-blue-600"
                        >

                        <span class="${
                            task.completed
                            ? "line-through text-gray-400"
                            : "text-gray-800"
                        }">
                            ${task.text}
                        </span>
                    </div>

                    <button
                        onclick="deleteTask(${task.id})"
                        class="bg-red-500 text-white px-3 py-2 rounded-lg hover:bg-red-600"
                    >
                        Delete
                    </button>
                `;

                taskList.appendChild(li);
            });

            const completedTasks =
                tasks.filter(task => task.completed).length;

            taskCounter.textContent =
                `${tasks.length} task${tasks.length !== 1 ? "s" : ""} | ${completedTasks} completed`;
        }

        // Press Enter to add task
        document.getElementById("taskInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });

        displayTasks();
    </script>

</body>
</html>
