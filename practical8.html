<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-100 to-purple-100">

    
        

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold mb-5 text-center text-blue-600">
            Student Registration<br>
        </h1>
<h1 class="text-xl font-extrabold text-blue-500"> Anisha Haldar</h1>
<h1 class="text-xl font-extrabold text-blue-500"> CS25069</h1><br>
        <form id="registrationForm">

            <!-- Student Name -->
            <label class="font-extrabold text-gray-700">
                Student Name
            </label>

            <input type="text" id="name"
                class="w-full border-2 border-blue-200 p-2 mb-3 rounded-lg focus:border-blue-500"
                placeholder="Enter your name">

            <!-- Email -->
            <label class="font-extrabold text-gray-700">
                Email
            </label>

            <input type="text" id="email"
                class="w-full border-2 border-blue-200 p-2 mb-3 rounded-lg focus:border-blue-500"
                placeholder="Enter your email">

            <!-- Password -->
            <label class="font-extrabold text-gray-700">
                Password
            </label>

            <input type="password" id="password"
                class="w-full border-2 border-blue-200 p-2 mb-2 rounded-lg focus:border-blue-500"
                placeholder="Enter password">

            <!-- Show Password -->
            <label class="text-xl text-gray-600 mb-3 block">
                <input type="checkbox" id="showPassword">
                Show Password
            </label>

            <!-- Mobile -->
            <label class="font-extrabold text-gray-700">
                Mobile Number
            </label>

            <input type="text" id="mobile"
                class="w-full border-2 border-blue-200 p-2 mb-4 rounded-lg focus:border-blue-500"
                placeholder="Enter 10-digit mobile number">

            <!-- resistor Button -->
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-purple-600 text-white font-semibold p-2 rounded-lg">
                registor
            </button>

            <!-- Message -->
            <p id="message" class="mt-4 text-center font-semibold"></p>

        </form>
    </div>


    <script>

        // Show / Hide Password
        document.getElementById("showPassword").onclick = function() {

            let password = document.getElementById("password");

            if (this.checked) {
                password.type = "text";
            } else {
                password.type = "password";
            }

        };


        // Form Validation
        document.getElementById("registrationForm").onsubmit = function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value.trim();

            let message = document.getElementById("message");


            // Mandatory fields
            if (name == "" || email == "" || password == "" || mobile == "") {

                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center font-semibold text-red-500";

                return;
            }


            // Name validation
            if (!/^[A-Za-z ]+$/.test(name)) {

                message.innerHTML = "Enter a valid student name.";
                message.className = "mt-4 text-center font-semibold text-red-500";

                return;
            }


            // Email validation
            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if (!emailPattern.test(email)) {

                message.innerHTML = "Enter a valid email address.";
                message.className = "mt-4 text-center font-semibold text-red-500";

                return;
            }


            // Password validation
            if (password.length < 6) {

                message.innerHTML = "Password must be at least 6 characters.";
                message.className = "mt-4 text-center font-semibold text-red-500";

                return;
            }


            // Mobile validation
            if (!/^[0-9]{10}$/.test(mobile)) {

                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center font-semibold text-red-500";

                return;
            }


            // Success message
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center font-semibold text-green-600";

        };

    </script>

</body>
</html>
